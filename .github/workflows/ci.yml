name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Every platform this claims to support, and every Node it claims to run on.
    # Windows earns its place: two of the bugs this suite pins were Windows-only
    # (a `which` that does not exist there, and a path spelled with backslashes
    # inside JSON), and neither was visible from macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The suite shells out to git, so it needs an identity to commit with.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Check every module parses
        run: node -e "const{readdirSync}=require('fs');const{execFileSync}=require('child_process');const f=[...readdirSync('src').map(x=>'src/'+x),...readdirSync('bin').map(x=>'bin/'+x)].filter(x=>x.endsWith('.mjs'));for(const x of f)execFileSync(process.execPath,['--check',x]);console.log(f.length+' files parse')"

      - name: Test
        run: npm test

      - name: Install cleanly and run the CLI
        run: |
          npm install -g .
          claude-transfer list
