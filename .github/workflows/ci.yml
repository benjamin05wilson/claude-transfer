name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install:
    # Path handling and shell behaviour differ by platform, so a fresh install is
    # checked on each rather than assumed from one.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g .
      - run: claude-transfer --help
      - run: claude-transfer list
